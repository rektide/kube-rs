[package]
name = "kube-runtime"
description = "Kubernetes controller runtime"
version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["kubernetes", "runtime", "reflector", "watcher", "controller"]
categories = ["web-programming::http-client", "caching", "network-programming"]

[features]
default = ["client", "events", "finalizer", "wait"]
# Kubernetes API client integration: the `watcher()`/`watch_object()` entry
# points and the `Controller` builder, all of which drive a `kube_client::Api`.
# Without it, the á la carte machinery (scheduler, Runner, reflector
# Store/Writer, `applier`, the `watcher::Event` vocabulary, predicates)
# compiles without kube-client, hyper, tower, TLS, or k8s-openapi — for
# driving the runtime from non-Kubernetes event sources.
client = ["dep:kube-client", "kube-core/k8s-openapi"]
# `events::Recorder`: publishes core/v1 Events through the client.
events = ["client", "dep:k8s-openapi", "dep:hostname"]
# `finalizer()`: JSON-patches `metadata.finalizers` through the client.
finalizer = ["client", "dep:json-patch"]
# `wait::await_condition()` and the built-in `conditions`.
wait = ["client"]
unstable-runtime = ["unstable-runtime-subscribe", "unstable-runtime-stream-control", "unstable-runtime-reconcile-on"]
unstable-runtime-subscribe = []
unstable-runtime-stream-control = []
unstable-runtime-reconcile-on = []

[package.metadata.docs.rs]
features = ["k8s-openapi/latest", "unstable-runtime"]
# Define the configuration attribute `docsrs`. Used to enable `doc_cfg` feature.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
futures = { workspace = true, features = ["async-await", "std"] }
kube-client = { path = "../kube-client", version = "=4.2.0", default-features = false, features = ["jsonpatch", "client"], optional = true }
kube-core = { path = "../kube-core", version = "=4.2.0", default-features = false }
educe = { workspace = true, features = ["Clone", "Debug", "Hash", "PartialEq"] }
serde.workspace = true
ahash.workspace = true
parking_lot.workspace = true
pin-project.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true, features = ["time"] }
tracing.workspace = true
json-patch = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
backon.workspace = true
hashbrown.workspace = true
k8s-openapi = { workspace = true, optional = true }
async-broadcast.workspace = true
async-stream.workspace = true
hostname = { workspace = true, optional = true }

[dev-dependencies]
kube = { path = "../kube", features = ["derive", "client", "runtime"] }
serde_json.workspace = true
serde-saphyr.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
rand.workspace = true
schemars.workspace = true
tracing-subscriber.workspace = true
k8s-openapi= { workspace = true, features = ["latest"] }
dhat.workspace = true

[[bench]]
name = "memory"
harness = false
