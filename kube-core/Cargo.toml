[package]
name = "kube-core"
description = "Kube shared types, traits and client-less behavior"
version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["kubernetes", "apimachinery"]
categories = ["api-bindings", "encoding", "parser-implementations"]

[package.metadata.docs.rs]
features = ["ws", "admission", "jsonpatch", "cel", "k8s-openapi/latest"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["k8s-openapi"]
# Use the real generated k8s-openapi types. Disabling this swaps in the
# lightweight apimachinery stand-ins from `kube_core::k8s` and removes the
# k8s-openapi dependency entirely (for non-Kubernetes uses of the machinery).
k8s-openapi = ["dep:k8s-openapi"]
ws = []
admission = ["json-patch", "k8s-openapi"]
jsonpatch = ["json-patch"]
schema = ["schemars"]
kubelet-debug = ["ws"]
cel = ["dep:kube-cel", "k8s-openapi"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
form_urlencoded.workspace = true
http.workspace = true
json-patch = { workspace = true, optional = true }
jiff = { workspace = true, features = ["std", "serde"] }
schemars = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
serde-value.workspace = true
derive_more = { workspace = true, features = ["from"] }
kube-cel = { version = "0.8.0", optional = true, features = ["validation"] }

[dev-dependencies]
k8s-openapi = { workspace = true, features = ["latest"] }
assert-json-diff.workspace = true
kube = { path = "../kube" }
serde-saphyr.workspace = true
